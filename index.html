<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RizzAI</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- LOGIN SCREEN -->

    <div id="loginScreen">

        <div class="loginCard">

            <div class="logo">
                ❤️
            </div>

            <h1>RizzAI</h1>

            <p>Your personal AI wingman.</p>

            <input
                id="name"
                type="text"
                placeholder="Your Name"
            >

            <input
                id="apikey"
                type="password"
                placeholder="Groq API Key"
            >

            <select id="model">

                <option value="llama-3.3-70b-versatile">
                    Llama 3.3 70B
                </option>

                <option value="llama-3.1-8b-instant">
                    Llama 3.1 8B
                </option>

                <option value="gemma2-9b-it">
                    Gemma 2 9B
                </option>

            </select>

            <button id="startBtn">
                Start Chatting →
            </button>

            <small>

                Your API key stays in your browser and is never stored.

            </small>

        </div>

    </div>



    <!-- CHAT APP -->

    <div id="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="profile">

                    <div class="avatar">

                        ❤️

                    </div>

                    <h2 id="username">

                    </h2>

                    <p>Using RizzAI</p>

                </div>

                <div class="menu">

                    <button id="clearChat">

                        🗑️ Clear Chat

                    </button>

                </div>

            </div>

            <div class="footer">

                Made with ❤️

            </div>

        </aside>



        <!-- MAIN -->

        <main class="chatArea">

            <header>

                <div>

                    <h2>

                        ❤️ RizzAI

                    </h2>

                    <p>

                        Smooth replies. Better conversations.

                    </p>

                </div>

            </header>



            <div id="messages">

            </div>



            <div class="inputArea">

                <input

                    id="prompt"

                    placeholder="Ask for pickup lines, replies, texting advice..."

                    autocomplete="off"

                >

                <button id="send">

                    ➜

                </button>

            </div>

        </main>

    </div>



    <script src="script.js"></script>

</body>

</html>
